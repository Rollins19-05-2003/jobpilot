services:
  api:
    build: ./api
    env_file: .env
    ports: ["8000:8000"]
    volumes:
      - ./profile:/app/profile
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/jobpilot.db

  n8n:
    image: n8nio/n8n:latest
    ports: ["5678:5678"]
    environment:
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
